district:
  name: "San Bernardino County Superintendent of Schools"

app:
  version: "0.1.0"

workability:
  login_url: "https://www.caworkability.org/auth"
  # Names that indicate a found student is already with us in the Search results page.
  # WAI has used both labels in different places/times; keep current name first.
  owning_org_names:
    - "San Bernardino County Office of Education"
    - "San Bernardino County Alternative Education"
  # Backward-compatible fallback for older code/config references.
  owning_org_name: "San Bernardino County Office of Education"
  # Used ONLY on the search screen
  search_project: "Any WAI Project"
  # Used ONLY when creating a new student
  create_project: "San Bernardino County Alternative Education (236-05)"
  # Used ONLY by the prior-year Transfer modal
  transfer_to_project: "San Bernardino County Office of Education (236-05)"

credentials:
  # Optional convenience; user can still be prompted at runtime if blank.
  username: "derek.carlson@sbcss.net"

input:
  # Optional convenience for GUI later; runner can still prompt for a path.
  default_excel_path: ""

columns:
  first_name: "First Name"
  last_name: "Last Name"
  ssid: "State Student ID"
  dob: "Birthdate"
  gender: "Gender"
  grade: "Grade"
  disability: "Description_CSE_DI"
  ethcd: "EthCd"
  race1: "Description_STU_RC1"
  aeries_school: "School name"

run:
  headless: false
  slow_mo_ms: 400
  resume: true
  stop_on_error: false

ui:
  preflight_validate: true

ledger:
  path: "output/logs/run_ledger.xlsx"

trace:
  # Keep ONLY this (runner should read trace.on_failure).
  on_failure: true

validation:
  require_ssid: true
  min_age_years: 13
  allowed_gender: ["M", "F", "N"]
  allowed_grades: ["7", "8", "9", "10", "11", "12"]
  allowed_ethcd: ["Y", "N"]
  # If disability is blank / "No Disability" / "EMD" / or otherwise unmapped, skip + log.
  skip_if_disability_missing_or_invalid: true

user_messages:
  CREATED: "✅ Added successfully"
  ALREADY_OWNED: "🏫 Already with your district"
  TRANSFER_REQUESTED: "📨 Transfer requested"
  TRANSFER_PENDING: "⏳ Transfer pending — awaiting approval"
  TRANSFERRED_PRIOR_YEAR: "📨 Prior-year record transferred"
  SERVE_DRY_RUN_FILLED: "✅ Serve dry-run filled"
  SERVE_SAVED: "✅ Serve saved"
  SERVE_SKIPPED_NOT_OWNED: "⏭️ Serve skipped — not with your district"
  SERVE_NOT_FOUND: "⚠️ Serve skipped — student not found"
  SERVE_ERROR: "❌ Serve error — see details"
  SKIPPED_RESUME: "⏭️ Already processed earlier"
  SKIPPED_MISSING_SSID: "⚠️ Missing SSID — skipped"
  NEEDS_INPUT_DATA: "⚠️ Missing/invalid required data — skipped"
  ERROR: "❌ Could not process — see details"


gender_mapping:
  # Input values from Aeries -> UI label on WAI page (radio group)
  M: "Male"
  F: "Female"
  N: "Non Binary"

